<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ Cardápio - Café</title>
    <!-- 🟢 CORREÇÃO 1: Adicionado o client-side do Socket.io para permitir o tempo real -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f1e8;
            color: #333;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .container {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .section {
            margin-bottom: 2rem;
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #8B4513;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #D2691E;
            padding-bottom: 0.5rem;
        }

        h3 {
            color: #A0522D;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #D2691E;
            box-shadow: 0 0 0 3px rgba(210, 105, 30, 0.1);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .item-card {
            background: #fff9f5;
            border: 1px solid #E8D5C4;
            border-radius: 6px;
            padding: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(210, 105, 30, 0.15);
        }

        .item-card h4 {
            color: #8B4513;
            margin-bottom: 0.5rem;
        }

        .descricao {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 0.5rem;
        }

        .preco {
            font-weight: 600;
            color: #D2691E;
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
        }

        button {
            transition: all 0.3s;
        }

        .btn-add {
            width: 100%;
            padding: 0.6rem;
            background: #D2691E;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add:hover {
            background: #A0522D;
        }

        .carrinho-items {
            background: #fff9f5;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .carrinho-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-bottom: 1px solid #E8D5C4;
            margin-bottom: 0.5rem;
        }

        .carrinho-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .item-info h4 {
            color: #8B4513;
            margin-bottom: 0.25rem;
        }

        .item-info p {
            color: #D2691E;
            font-weight: 600;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-qty {
            width: 30px;
            height: 30px;
            border: 1px solid #D2691E;
            background: white;
            color: #D2691E;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-qty:hover {
            background: #D2691E;
            color: white;
        }

        .btn-remove {
            background: #ff4444;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            font-size: 1rem;
        }

        .btn-remove:hover {
            background: #cc0000;
        }

        .carrinho-total {
            background: #D2691E;
            color: white;
            padding: 1rem;
            border-radius: 6px;
            text-align: right;
            margin-bottom: 1rem;
        }

        .carrinho-total h3 {
            color: white;
            border: none;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #228B22;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover:not(:disabled) {
            background: #1a6b1a;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .carrinho-vazio {
            text-align: center;
            color: #999;
            padding: 2rem;
        }

        .mensagem {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .sucesso {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 3rem;
            border-radius: 6px;
            text-align: center;
            max-width: 500px;
            margin: 2rem auto;
        }

        .sucesso h2 {
            color: #155724;
            border: none;
            margin-bottom: 1rem;
        }

        .sucesso p {
            font-size: 1.1rem;
            margin: 0.5rem 0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1rem;
            }

            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .carrinho-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .item-controls {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>☕ Cardápio do Café</h1>
        </header>

        <div class="container">
            <!-- Página de Pedido -->
            <div id="pagePedido">
                <div class="section">
                    <h2>Dados do Pedido</h2>
                    <div class="form-group">
                        <input type="number" id="mesa" placeholder="Número da Mesa" class="input" min="1">
                    </div>
                    <div class="form-group">
                        <input type="text" id="nome" placeholder="Seu Nome" class="input">
                    </div>
                    <div class="form-group">
                        <input type="tel" id="telefone" placeholder="Seu Telefone" class="input">
                    </div>
                </div>

                <div class="section" id="cardapioSection">
                    <h2>Selecione seus Itens</h2>
                    <div id="cardapioContainer"></div>
                </div>

                <div class="section">
                    <h2>Seu Carrinho</h2>
                    <div id="carrinhoContainer">
                        <p class="carrinho-vazio">Nenhum item no carrinho</p>
                    </div>
                </div>

                <div id="mensagemContainer"></div>
            </div>

            <!-- Página de Sucesso -->
            <div id="pageSucesso" class="hidden">
                <div class="sucesso">
                    <h2>✅ Pedido Enviado!</h2>
                    <p>Seu pedido foi recebido com sucesso!</p>
                    <p>Aguarde a chamada da sua mesa.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.protocol === 'file:'
            ? 'http://localhost:3000'
            : 'https://cafe-app-rdba.onrender.com'; // link onrender
        // Inicializa o Socket e os futuros Fetchs usando a variável dinâmica
        const socket = io(API_URL);
        let cardapio = [];
        let carrinho = [];

        // Fetch cardápio
        async function fetchCardapio() {
            try {
                // 🟢 CORREÇÃO 2: Rota alterada para incluir o '/api' conforme padrão do backend
                const res = await fetch(`${API_URL}/api/cardapio`);
                cardapio = await res.json();
                renderCardapio();
            } catch (error) {
                console.error('Erro ao buscar cardápio:', error);
                document.getElementById('cardapioContainer').innerHTML = '<p>Erro ao carregar cardápio</p>';
            }
        }

        // Renderizar cardápio
        function renderCardapio() {
            const container = document.getElementById('cardapioContainer');
            const categorias = {};

            cardapio.forEach(item => {
                if (!categorias[item.categoria]) {
                    categorias[item.categoria] = [];
                }
                categorias[item.categoria].push(item);
            });

            container.innerHTML = '';
            Object.keys(categorias).forEach(categoria => {
                const categoryDiv = document.createElement('div');
                categoryDiv.innerHTML = `<h3>${categoria}</h3>`;
                
                const grid = document.createElement('div');
                grid.className = 'items-grid';

                categorias[categoria].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <h4>${item.nome}</h4>
                        ${item.descricao ? `<p class="descricao">${item.descricao}</p>` : ''}
                        <p class="preco">R$ ${parseFloat(item.preco).toFixed(2)}</p>
                        <button class="btn-add" onclick="adicionarAoCarrinho(${item.id}, '${item.nome}', ${item.preco})">+ Adicionar</button>
                    `;
                    grid.appendChild(card);
                });

                categoryDiv.appendChild(grid);
                container.appendChild(categoryDiv);
            });
        }

        // Adicionar ao carrinho
        function adicionarAoCarrinho(id, nome, preco) {
            const existente = carrinho.find(c => c.cardapio_id === id);
            
            if (existente) {
                existente.quantidade++;
            } else {
                carrinho.push({ cardapio_id: id, nome, preco, quantidade: 1 });
            }

            renderCarrinho();
        }

        // Remover do carrinho
        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(c => c.cardapio_id !== id);
            renderCarrinho();
        }

        // Atualizar quantidade
        function atualizarQuantidade(id, quantidade) {
            if (quantidade <= 0) {
                removerDoCarrinho(id);
            } else {
                const item = carrinho.find(c => c.cardapio_id === id);
                if (item) {
                    item.quantidade = quantidade;
                    renderCarrinho();
                }
            }
        }

        // Renderizar carrinho
        function renderCarrinho() {
            const container = document.getElementById('carrinhoContainer');

            if (carrinho.length === 0) {
                container.innerHTML = '<p class="carrinho-vazio">Nenhum item no carrinho</p>';
                return;
            }

            let total = 0;
            let html = '<div class="carrinho-items">';

            carrinho.forEach(item => {
                const itemTotal = item.preco * item.quantidade;
                total += itemTotal;
                
                html += `
                    <div class="carrinho-item">
                        <div class="item-info">
                            <h4>${item.nome}</h4>
                            <p>R$ ${parseFloat(item.preco).toFixed(2)} x ${item.quantidade}</p>
                        </div>
                        <div class="item-controls">
                            <button class="btn-qty" onclick="atualizarQuantidade(${item.cardapio_id}, ${item.quantidade - 1})">-</button>
                            <span>${item.quantidade}</span>
                            <button class="btn-qty" onclick="atualizarQuantidade(${item.cardapio_id}, ${item.quantidade + 1})">+</button>
                            <button class="btn-remove" onclick="removerDoCarrinho(${item.cardapio_id})">🗑️</button>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            html += `<div class="carrinho-total"><h3>Total: R$ ${total.toFixed(2)}</h3></div>`;
            html += `<button class="btn-submit" onclick="enviarPedido()">✓ Enviar Pedido</button>`;

            container.innerHTML = html;
        }

        // Enviar pedido
        async function enviarPedido() {
            const mesa = document.getElementById('mesa').value;
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;

            if (!mesa || !nome || !telefone || carrinho.length === 0) {
                mostrarMensagem('❌ Por favor, preencha todos os campos e selecione itens');
                return;
            }

            try {
                // 🟢 CORREÇÃO 3: Rota alterada para incluir o '/api' conforme padrão do backend
                const response = await fetch(`${API_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mesa: parseInt(mesa),
                        cliente_nome: nome,
                        cliente_telefone: telefone,
                        itens: carrinho.map(c => ({
                            cardapio_id: c.cardapio_id,
                            quantidade: c.quantidade
                        }))
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    mostrarMensagem('✅ Pedido enviado com sucesso!');
                    carrinho = [];
                    document.getElementById('mesa').value = '';
                    document.getElementById('nome').value = '';
                    document.getElementById('telefone').value = '';
                    renderCarrinho();

                    document.getElementById('pagePedido').classList.add('hidden');
                    document.getElementById('pageSucesso').classList.remove('hidden');

                    setTimeout(() => {
                        document.getElementById('pagePedido').classList.remove('hidden');
                        document.getElementById('pageSucesso').classList.add('hidden');
                    }, 3000);
                } else {
                    mostrarMensagem('❌ ' + (data.error || 'Erro ao enviar pedido'));
                }
            } catch (error) {
                console.error('Erro:', error);
                mostrarMensagem('❌ Erro ao enviar pedido. Verifique sua conexão.');
            }
        }

        // Mostrar mensagem
        function mostrarMensagem(msg) {
            const container = document.getElementById('mensagemContainer');
            container.innerHTML = `<div class="mensagem">${msg}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // Inicializar
        fetchCardapio();
    </script>
</body>
</html>
